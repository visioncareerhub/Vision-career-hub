<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision Career Hub</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fc;
color:#222;
}

header{
background:linear-gradient(135deg,#0f172a,#2563eb);
color:white;
padding:80px 20px;
text-align:center;
}

header h1{
font-size:48px;
margin-bottom:15px;
}

header p{
font-size:20px;
margin-bottom:25px;
}

.btn{
display:inline-block;
background:#22c55e;
color:white;
padding:14px 28px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

.section{
padding:60px 20px;
max-width:1200px;
margin:auto;
}

.section h2{
text-align:center;
margin-bottom:30px;
font-size:32px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card h3{
color:#2563eb;
margin-bottom:10px;
}

.premium{
background:white;
padding:40px;
text-align:center;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.premium h3{
font-size:40px;
color:#22c55e;
margin:15px 0;
}

footer{
background:#0f172a;
color:white;
text-align:center;
padding:25px;
margin-top:40px;
}
</style>

</head>
<body>

<header>
<h1>Vision Career Hub</h1>
<p>Discover Your Future. Build Your Vision.</p>
<a href="#" class="btn">Explore Careers</a>
</header>

<section class="section">
<h2>Popular
