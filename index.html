<!DOCTYPE html>

<head>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:#071120;
color:white;
overflow-x:hidden;
}

.container{
width:90%;
max-width:1200px;
margin:auto;
}

a{
text-decoration:none;
}

header{
position:fixed;
top:0;
left:0;
width:100%;
background:rgba(7,17,32,.95);
backdrop-filter:blur(15px);
border-bottom:1px solid rgba(255,255,255,.08);
z-index:1000;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 0;
}

.logo{
font-size:22px;
font-weight:800;
}

.logo span{
color:#FFD700;
}

nav ul{
display:flex;
list-style:none;
gap:25px;
}

nav ul li a{
color:white;
font-size:15px;
font-weight:500;
transition:.3s;
}

nav ul li a:hover{
color:#FFD700;
}

.buy-btn{
background:linear-gradient(45deg,#ffb300,#FFD700);
padding:12px 25px;
border-radius:50px;
font-weight:700;
color:black;
}

.hero{
padding-top:140px;
padding-bottom:100px;
}

.hero-content{
display:flex;
justify-content:space-between;
align-items:center;
gap:50px;
flex-wrap:wrap;
}

.left{
flex:1;
}

.left h1{
font-size:65px;
font-weight:800;
line-height:1.1;
}

.left span{
color:#FFD700;
}

.left p{
margin-top:20px;
font-size:18px;
line-height:1.8;
color:#d8d8d8;
}

.buttons{
display:flex;
gap:20px;
margin-top:35px;
flex-wrap:wrap;
}

.btn1{
background:linear-gradient(45deg,#ff9800,#FFD700);
padding:16px 35px;
border-radius:50px;
font-weight:700;
color:black;
}

.btn2{
border:2px solid #FFD700;
padding:16px 35px;
border-radius:50px;
color:white;
}

.right{
flex:1;
text-align:center;
}

.right img{
max-width:430px;
width:100%;
border-radius:25px;
box-shadow:0 0 40px rgba(255,215,0,.25);
}

.section-title{
font-size:45px;
text-align:center;
margin-bottom:50px;
color:#FFD700;
}

.features{
padding:100px 0;
}

.feature-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.feature-card{
background:#0d1b34;
padding:30px;
border-radius:25px;
border:1px solid rgba(255,255,255,.05);
transition:.4s;
}

.feature-card:hover{
transform:translateY(-10px);
}

.feature-card h3{
color:#FFD700;
margin-bottom:15px;
}
</style>
</head>

<body>

<header>

<div class="container">

<nav>

<div class="logo">
VISION <span>CAREER HUB</span>
</div>

<ul>

<li><a href="#">Careers</a></li>
<li><a href="#">FAQ</a></li>
</ul>

<a href="#" class="buy-btn">₹9 PDF</a>

</nav>

</div>

</header>

<section class="hero">

<div class="container">

<div class="hero-content">

<div class="left">

<h1>
100+ <span>Career Options</span><br>
Nobody Told You About

Explore career options, salary insights, roadmaps, top colleges and study abroad opportunities in simple language.

<a href="#" class="btn1">

</a>
