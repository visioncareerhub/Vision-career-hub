<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision Career Hub</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
}

header{
background:linear-gradient(135deg,#0f172a,#2563eb);
color:white;
padding:60px 20px;
text-align:center;
}

header h1{
font-size:42px;
margin-bottom:15px;
}

header p{
font-size:18px;
margin-bottom:20px;
}

.btn{
background:#22c55e;
padding:12px 25px;
color:white;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

.section{
padding:40px 20px;
max-width:1200px;
margin:auto;
}

.section h2{
text-align:center;
margin-bottom:30px;
color:#0f172a;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.card h3{
margin-bottom:10px;
color:#2563eb;
}

.price{
background:white;
text-align:center;
padding:40px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.price h3{
font-size:35px;
color:#22c55e;
}

footer{
background:#0f172a;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}
</style>


<footer>
<p>© 2026 Vision Career Hub | All Rights Reserved</p>
</footer>

...
</section>

<section class="section">

</section>

</section>

<section class="section">
...
</section>

</body>
</html>
